<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#3B82F6" />

  <!-- Coffee Cup -->
  <g transform="translate(256, 280)">
    <!-- Cup body -->
    <path d="M -80 -60 L -90 60 L 90 60 L 80 -60 Z" fill="white" />

    <!-- Handle -->
    <path d="M 85 -10 Q 130 -10 130 20 Q 130 50 85 50" fill="none" stroke="white" stroke-width="12"
      stroke-linecap="round" />

    <!-- Steam 1 -->
    <path d="M -40 -70 Q -50 -100 -40 -120" fill="none" stroke="white" stroke-width="8"
      stroke-linecap="round" opacity="0.8" />

    <!-- Steam 2 -->
    <path d="M 0 -70 Q -10 -100 0 -130" fill="none" stroke="white" stroke-width="8"
      stroke-linecap="round" opacity="0.8" />

    <!-- Steam 3 -->
    <path d="M 40 -70 Q 30 -100 40 -120" fill="none" stroke="white" stroke-width="8"
      stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Text "CAFE" -->
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
    fill="white" text-anchor="middle">CAFE</text>
</svg>